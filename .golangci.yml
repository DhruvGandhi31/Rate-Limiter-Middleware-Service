# golangci-lint v2 config. Conservative ruleset — flag real issues without
# forcing stylistic noise. See https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m

linters:
  # v2 replaces `disable-all: true` with `default: none`; we opt in explicitly.
  # `gosimple` was merged into `staticcheck` in v2, so it's not listed separately.
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

# Formatters are a separate category in v2 (previously mixed in with linters).
formatters:
  enable:
    - gofmt
