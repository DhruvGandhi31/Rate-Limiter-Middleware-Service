name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + unit + integration
    runs-on: ubuntu-latest
    # Service-container Redis is dramatically faster than testcontainers spinning
    # one up per package, and CI runners have Docker readily available.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: unit + concurrent tests (race)
        run: go test -race -count=1 ./tests/unit/... ./tests/concurrent/...

      - name: integration tests
        env:
          REDIS_ADDR: localhost:6379
        run: go test -race -count=1 ./tests/integration/...

      - name: benchmarks (smoke, 1x)
        env:
          REDIS_ADDR: localhost:6379
        run: go test -bench=. -benchtime=1x -run=^$ ./bench/...
