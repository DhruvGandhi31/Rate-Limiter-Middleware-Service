services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 5

  rate-limiter:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis:6379"
      SERVER_ADDR: ":8080"
      FAIL_MODE: "closed"
    ports:
      - "8080:8080"
    # Dockerfile already sets ENTRYPOINT=/app/rate-limiter; only pass args here.
    command: ["-config", "/app/config.yaml"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
